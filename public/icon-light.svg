               C -5,98 -16,68 -16,42 
               C -16,5 2,-26 12,-38 
               C 6,-45 0,-47 -3,-48 Z" 
            fill="#FFFFFF" />

      <!-- Conch Lip Detail Ridge -->
      <path d="M 6,-55 
               C 18,-42 22,-20 18,12 
               C 16,26 10,48 2,68 
               C 8,50 14,30 14,15 
               C 14,-15 10,-35 2,-48 Z" 
