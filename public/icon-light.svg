             C 86,150 48,190 -16,215 
             C 5,188 20,165 30,135 
             C 58,58 55,-35 25,-105 
             C 18,-122 8,-150 8,-174 Z" 
          fill="url(#rightWingGrad)" />

    <!-- Central Conch Shell Body -->
    <g id="shankha-body">
      <!-- Top spiral nodule (Crest tip) -->
